_target_: src.core.builder.XModel
task: ${training.task.type}
type: weight_posture

Model:
  input_channel: 4
  Backbone:

    # [from, number, module, args]
    [
      [-1, 1, ConvNextStem, [96, 4, 4]], # 0-P1/2
      [-1, 3, ConvNextBlock, [96,0.1]], # 1-P2/4
      [-1, 1, Downsample, [192,2,2]],
      [-1, 3, ConvNextBlock, [192,0.1]],  # 4-P3/8
      [-1, 1, Downsample, [384,2,2]],
      [-1, 9, ConvNextBlock, [384,0.1]], # 8-P4/16
      [-1, 1, Downsample, [768,2,2]],
      [-1, 3, ConvNextBlock, [768,0.1]], # 12-P5/32
      [-1, 1, SPPF, [768, 5]], # 15
    ]

  Head:
    [
      [-1, 1, Conv, [384, 1, 1]],
      [-1, 1, Upsample, [None, 2, "nearest"]],
      [[-1, 5], 1, Concat, [1]], # cat backbone P4
      [-1, 3, C3, [384, False]], # 19

      [-1, 1, Conv, [192, 1, 1]],
      [-1, 1, Upsample, [None, 2, "nearest"]],
      [[-1, 3], 1, Concat, [1]], # cat backbone P3
      [-1, 3, C3, [192, False]], # 23 (P3/8-small)


      [8, 1, Upsample, [None, 2, "nearest"]],
      [16, 1, Conv, [192, 3, 2]],
      [[-1, 17, 12], 1, Concat, [1]],
      [-1, 1, DecoupleHead,[]], # Detect(P3, P4, P5)27
    ]

  weights: ""
