# Public configuration for the best released WPMNet model.
# This file is self-contained so the repository can expose only this config
# and configs/test_config.yaml while keeping internal experiment configs private.

model:
  _target_: src.core.builder.XModel
  task: ${training.task.type}
  type: weight_posture
  Model:
    input_channel: 4
    Backbone:
      [
        [-1, 1, ResNetStem_dual, [64, 7, 2]],
        [-1, 1, ResNetBottleneckDown_dual, [256, 1]],
        [-1, 2, ResNetBottleneck_dual, [256]],
        [-1, 1, FeatureRectifyModule, [256]],
        [-1, 1, ResNetBottleneckDown_dual, [512, 2]],
        [-1, 3, ResNetBottleneck_dual, [512]],
        [-1, 1, FeatureRectifyModule, [512]],
        [-1, 1, ResNetBottleneckDown_dual, [1024, 2]],
        [-1, 5, ResNetBottleneck_dual, [1024]],
        [-1, 1, FeatureRectifyModule, [1024]],
        [-1, 1, ResNetBottleneckDown_dual, [2048, 2]],
        [-1, 2, ResNetBottleneck_dual, [2048]],
        [-1, 1, FeatureRectifyModule, [2048]],
      ]
    Head:
      [
        [[12, 9, 6], 1, AttentionFusion, [512, 128]],
        [-1, 1, CoupleHead, [384]],
      ]
    weights: ""

data:
  _target_: src.core.builder.build_dataset
  img_size: 224
  class_names:
    - standing
    - lyingonstomach
    - lyingonside
  modality: [rgb, depth]
  train:
    path: data/700x700/train.txt
    cache: ""
    augment: true
  val:
    path: data/700x700/val.txt
    cache: ""
    augment: false
  test:
    path: data/700x700/test.txt
    cache: ""
    augment: false
  train_loader:
    _target_: torch.utils.data.DataLoader
    batch_size: ${training.parameter.batch_size}
    shuffle: true
    num_workers: ${training.parameter.num_workers}
  val_loader:
    _target_: torch.utils.data.DataLoader
    batch_size: ${training.parameter.batch_size}
    shuffle: false
    num_workers: ${training.parameter.num_workers}
  test_loader:
    _target_: torch.utils.data.DataLoader
    batch_size: ${training.parameter.batch_size}
    shuffle: false
    num_workers: ${training.parameter.num_workers}

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.00005
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${training.parameter.epochs}
  eta_min: 0.000005
  warmup_iters: 5
  warmup_start_factor: 0.01

augmentation:
  random_horizontal_flip:
    prob: 0.5
  random_vertical_flip:
    prob: 0.5

training:
  parameter:
    epochs: 100
    batch_size: 64
    num_workers: 10
    seed: 20
    device: cuda
    use_amp: true
    ddp: true
  task:
    type: weight_posture
    loss:
      _target_: src.core.loss.PWAPLoss
  metrics:
    regression:
      - mae
      - rmse
      - r2
      - mape
    classification:
      - accuracy
      - f1

visualization:
  log_images: true
  log_model_graph: true
  log_interval: 10
  visualization_interval: 5
  target_layer:

experiment:
  name: wpmnet
  run_name: best
  tags: ["wpmnet", "rgb-d", "weight-posture"]
  description: "Best released WPMNet configuration."

mlflow:
  tracking_uri: "http://localhost:2000"
  log_artifacts: true

snapshot: 0
